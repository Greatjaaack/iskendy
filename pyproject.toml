# Зависимости бэкенда. Раньше это был requirements.txt со сплошными «>=» и без
# lock-файла: каждая пересборка тянула свежайшие версии, и то, что уезжало в
# прод, ни разу не совпадало с тем, что проверяли локально. Теперь версии
# фиксирует poetry.lock, а обновление становится отдельным осознанным шагом
# (`poetry update`), видимым в диффе.
[project]
name = "iskendy-site"
version = "0.1.0"
description = "Табло заказов «Искенди» — FastAPI + SQLite"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi (>=0.141,<0.142)",
    "uvicorn[standard] (>=0.52,<0.53)",
    "pydantic-settings (>=2.15,<3.0)",
    "segno (>=1.6,<2.0)",
    "httpx (>=0.28,<0.29)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]

# Тесты живут в backend/tests и импортируют модули приложения напрямую
# (main, db, notify), поэтому backend должен быть на пути импорта.
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"
