# Прод iskendy.ru — контейнер без внешних портов, за общим Caddy
# (сеть dashboards_default). HTTPS терминирует Caddy.
# Деплой на сервере: git pull && docker compose -f docker-compose.prod.yml up -d --build
services:
  app:
    build: .
    container_name: iskendy
    env_file:
      - .env
    environment:
      DB_PATH: /data/iskendy.db
    volumes:
      - app-data:/data
    restart: unless-stopped
    # Ротация docker-логов. По умолчанию json-file растёт без предела: за пять
    # дней набегало 16 МБ, из них 92% — опрос табло. Шум теперь не пишется, но
    # потолок нужен всё равно: диск на сервере занят на 82%.
    # История при этом живёт не здесь, а в /data/logs внутри volume — docker
    # стирает свои логи вместе с контейнером при каждом деплое.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dashboards_default

networks:
  dashboards_default:
    external: true

volumes:
  app-data:
